[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nwm_metrics"
dynamic = ["version"]
description = "Lightweight library for computing NWM metrics."
readme = "README.md"
maintainers = [
    { name = "Yuqiong Liu", email = "yuqiong.liu@entarian.com" },
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: Free To Use But Restricted",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Operating System :: OS Independent",
]

requires-python = ">=3.10"

dependencies = [
    'hydrotools.events==1.1.5',
    'hydrotools.metrics==1.3.3',
    'hydrotools.nwis_client==3.3.1',
    'hydrotools_restclient',
    'numpy<2',
    'pandas',
    'scipy',
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nwm_metrics*"]

[tool.setuptools.dynamic]
version = {attr = "nwm_metrics.__version__"}
